<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myo · Wearable connection</title>
<style>
  :root { --bg: #f4f7fd; --card: #ffffff; --fg: #0a1c3d; --muted: #52617b; --good: #0f9f68; --bad: #dc3d43; --line: #e3e9f2; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1119; --card: #111923; --fg: #e8edf4; --muted: #98a7bc; --line: #232f3f; --good: #34d399; --bad: #ff6b6b; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 420px; width: 100%; padding: 28px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: center; }
  h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.01em; }
  p { margin: 0 0 18px; color: var(--muted); }
  .ok { color: var(--good); } .bad { color: var(--bad); }
  a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="t">Finishing…</h1>
  <p id="d">Returning you to Myo.</p>
  <a id="back" href="./#wearables">Back to Myo</a>
</main>
<script>
  // The Merakinetics wearables proxy redirects here after Oura or WHOOP sign-in (Supabase serves function HTML as
  // plain text, so the proxy cannot show this page itself). Tell the Myo tab that opened the sign-in, then close.
  (function () {
    var q = new URLSearchParams(location.search), p = q.get('provider') || '', st = q.get('status') || 'error', detail = q.get('detail') || '';
    var names = { oura: 'Oura', whoop: 'WHOOP' }, name = names[p] || 'Your wearable';
    var t = document.getElementById('t'), d = document.getElementById('d');
    if (st === 'connected') { t.textContent = name + ' connected'; t.className = 'ok'; d.textContent = 'You can close this tab. Myo is syncing your data.'; }
    else if (st === 'denied') { t.textContent = name + ' was not connected'; t.className = 'bad'; d.textContent = 'You did not allow access. You can try again from the Wearables page.'; }
    else { t.textContent = name + ' was not connected'; t.className = 'bad'; d.textContent = detail || 'Something went wrong. Try again from the Wearables page.'; }
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: st === 'connected' ? 'wearable-connected' : 'wearable-failed', provider: p, detail: detail }, location.origin);
        if (st === 'connected') setTimeout(function () { window.close(); }, 1200);
      }
    } catch (e) { /* opener on another origin: the link still works */ }
  })();
</script>
</body>
</html>
