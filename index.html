/* Layout: one-screen OS shell: glass header, icon rail (bottom bar on phones), scrolling workspace over an ambient light field.
   Look v5 ("AI lab"): frosted translucent panels, hairline borders, gradient actions, glowing focus and a drifting glow field.
   Shell v6: FitScript-style top bar with a centred pill navigation (menus per group), tab bar on phones. Default scheme Clinical:
   pale blue page, flat white cards, navy type, one blue accent; real 3D anatomy (js/anatomy3d.js) lives in dark hologram stages.
   Eight colour schemes x light/dark, picked from the header palette (js/look.js): Clinical, Electric (blue field), Cobalt (base tokens below), Aurora, Synapse,
   Biolume, Solar, Graphite (generated blocks further down; contrast-checked by tools/schemes.js). Status and data colours stay fixed.
   Type: Space Grotesk for display, Inter for text, JetBrains Mono for numbers and labels. */
:root {
  --bg: #f2f5fb; --rail: #ffffff; --card: rgba(255,255,255,.80); --card-2: #e9eff9; --line: #dde5f2; --line-2: #c7d3e7; --fg: #0a1633; --muted: #53638a; --dim: #a3b0c5; --accent: #1d4ed8; --accent-fg: #ffffff; --accent-2: #0369a1; --btn: #1d4ed8; --btn-2: #0e7490; --btn-fg: #ffffff; --glow-1: #3b82f6; --glow-2: #06b6d4; --glow-3: #8b5cf6; --brand-1: #1f5bff; --brand-2: #0ea5e9;
  --good: #0f9f68; --warn: #c98a04; --bad: #dc3d43;
  --stage: #040b22; --stage-grid: #0e1c44; --stage-dim: #5d76ad;
  --holo-bg: #061233; --holo-1: #1f5bff; --holo-2: #38bdf8; --holo-3: #c7e9ff; --heat: #ffb020;
  --z-strength: #1d4ed8; --z-cardio: #ea6a1f; --z-functional: #5f9a0f; --z-recovery: #7c4ddb; --z-tech: #0ea5e9;
  --glow-a: .3; --sheen: rgba(255, 255, 255, .9);
  --shadow: 0 1px 2px rgba(10, 22, 51, .04), 0 14px 34px -20px color-mix(in srgb, var(--glow-1) 60%, transparent);
  --f-display: 'Space Grotesk', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 18px; --r-sm: 11px;
}

  --bg: #050a1a; --rail: #070e24; --card: rgba(14,24,52,.70); --card-2: #0f1b3a; --line: #1a2850; --line-2: #28407a; --fg: #eaf1ff; --muted: #93a5c9; --dim: #4a5f8c; --accent: #7aa2ff; --accent-fg: #04102b; --accent-2: #38bdf8; --btn: #6b97ff; --btn-2: #38bdf8; --btn-fg: #04102b; --glow-1: #2563eb; --glow-2: #0891b2; --glow-3: #6d28d9; --brand-1: #2563eb; --brand-2: #22d3ee;

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { letter-spacing: -0.02em; }
.muted { color: var(--muted); } .small { font-size: 12px; } .block { display: block; }

h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }

/* ── shell ── */
.app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 76px 1fr; height: 100%; }
.hdr { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; height: 54px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--rail) 86%, transparent); backdrop-filter: blur(14px); }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.logo-mk { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 11px var(--f-display); color: #fff; background: radial-gradient(circle at 30% 25%, var(--holo-2), var(--holo-1) 60%, var(--holo-bg)); box-shadow: 0 4px 14px -4px var(--holo-1); }
.logo b { font: 500 15px var(--f-display); letter-spacing: 0.26em; }
.logo span { font: 10px var(--f-mono); color: var(--muted); letter-spacing: 0.1em; }
.hdr-sp { flex: 1; }
.chip-score { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1px solid var(--line-2); border-radius: 20px; background: var(--card); text-decoration: none; color: var(--fg); }
.chip-score b { font: 700 13px var(--f-mono); color: var(--accent); }
.chip-score span { font-size: 11px; color: var(--muted); }
.save { font-size: 11px; color: var(--muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--f-body); color: var(--btn-fg); background: var(--btn); text-decoration: none; }
nav#nav { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 10px 6px; overflow-y: auto; }
.nav-i { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 10.5px; font-weight: 500; text-align: center; line-height: 1.15; }
.nav-i:hover { background: var(--card); color: var(--fg); }
.nav-i[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
main#main { overflow-y: auto; overflow-x: hidden; }
#view { padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 761px) { #view { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  nav#nav { grid-row: 3; flex-direction: row; border-right: 0; border-top: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .nav-i { min-width: 62px; flex: 0 0 auto; }
  .save, .chip-score span.rd { display: none; }
  .logo span { display: none; }
}

/* ── view header ── */
.vhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.vhead > div:first-child { min-width: 0; }
.eyebrow { font: 500 11px var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.sub { color: var(--muted); margin-top: 4px; }
.vhead-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hstat { display: flex; flex-direction: column; padding: 7px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); min-width: 88px; box-shadow: var(--shadow); }
.hstat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.hstat b { font: 700 18px var(--f-mono); }
.hstat.sm { padding: 3px 8px; min-width: 0; } .hstat.sm b { font-size: 13px; }
.banner { border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); background: color-mix(in srgb, var(--accent) 6%, var(--card)); border-radius: var(--r); padding: 10px 14px; font-size: 13px; color: var(--muted); }
.banner strong { color: var(--fg); }

/* ── grids & cards ── */
.grid { display: grid; gap: 16px; }
.g-hero { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); } .g-hero > .hero-card { grid-row: span 2; }
.g-body { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-ar { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.g-gym { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); }
.g-chat { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g-gym, .g-ar { grid-template-columns: 1fr; } }
@media (max-width: 860px) { .g-hero, .g-2-1, .g-2, .g-chat, .g-body { grid-template-columns: 1fr; } .g-hero > .hero-card { grid-row: auto; } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.card.flush { padding: 0; gap: 0; overflow: hidden; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-h.pad { padding: 14px 16px 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.center { justify-content: center; }
.fine { font-size: 11.5px; color: var(--muted); }

/* ── controls ── */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--btn); background: var(--btn); color: var(--btn-fg); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost.danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.btn.file { position: relative; overflow: hidden; } .btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; text-align: left; display: inline-flex; align-items: center; gap: 4px; }
.link.small { font-size: 12px; }
.icon-btn { width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-weight: 700; }
.icon-btn:hover { color: var(--bad); border-color: var(--bad); }
.chip-btn { padding: 4px 10px; border-radius: 14px; border: 1px solid var(--line-2); background: transparent; color: var(--fg); font-size: 12px; cursor: pointer; }
.chip-btn:hover, .chip-btn.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
input, select, textarea { background: var(--card-2); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 10px; min-width: 0; }
textarea { resize: vertical; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field input, .field select { color: var(--fg); font-size: 14px; }
.field-inline { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-end { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
.check { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; border: 1.5px solid var(--line-2); background: transparent; color: transparent; display: grid; place-items: center; cursor: pointer; }
.check:hover { border-color: var(--accent); color: var(--dim); }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.toggle { width: 40px; height: 22px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--card-2); position: relative; cursor: pointer; flex: 0 0 auto; }
.toggle span { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); transition: transform .2s; }
.toggle[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 25%, var(--card-2)); border-color: var(--accent); }
.toggle[aria-checked="true"] span { transform: translateX(18px); background: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--btn); color: var(--btn-fg); font-weight: 600; }

/* ── status ── */
.pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.pill-good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.pill-muted { color: var(--muted); background: var(--card-2); }
.chip { display: inline-flex; padding: 2px 9px; border-radius: 999px; font: 600 10.5px var(--f-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--card-2); border: 1px solid var(--line); white-space: nowrap; }
.chip-supplement { color: var(--z-recovery); } .chip-training, .chip-move { color: var(--accent); } .chip-nutrition, .chip-fuel { color: var(--z-cardio); }
.chip-sleep { color: var(--accent-2); } .chip-mind { color: var(--z-functional); } .chip-work { color: var(--muted); } .chip-life { color: var(--warn); } .chip-ai { color: var(--accent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 8px; }
.dot-online { background: var(--good); box-shadow: 0 0 6px var(--good); } .dot-beta { background: var(--warn); } .dot-idle { background: var(--muted); } .dot-planned { background: transparent; border: 1.5px solid var(--dim); }
.dot-work { background: var(--muted); } .dot-move { background: var(--accent); } .dot-fuel { background: var(--z-cardio); } .dot-sleep { background: var(--accent-2); } .dot-mind { background: var(--z-functional); } .dot-life { background: var(--warn); }
.live { display: inline-flex; align-items: center; gap: 6px; font: 10.5px var(--f-mono); color: var(--good); text-transform: uppercase; letter-spacing: 0.06em; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* ── today ── */
.score-card { flex-direction: row; align-items: center; gap: 20px; flex-wrap: wrap; }
.score-ring { position: relative; width: 148px; height: 148px; flex: 0 0 auto; }
.score-num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.score-num b { font: 600 46px var(--f-display); line-height: 1; letter-spacing: -0.04em; }
.score-num span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.sbars { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
.sbar { display: grid; grid-template-columns: 76px 1fr 30px; align-items: center; gap: 10px; background: none; border: 0; padding: 3px 0; cursor: pointer; text-align: left; font-size: 12.5px; color: var(--muted); }
.sbar:hover { color: var(--fg); }
.sbar b { text-align: right; color: var(--fg); font-size: 13px; }
.sbar-track { display: block; height: 6px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.sbar-track.lg { height: 8px; }
.sbar-track span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 3px; }
.big { font: 700 44px var(--f-mono); line-height: 1; letter-spacing: -0.04em; }
.big small { font-size: 16px; color: var(--muted); }
.kv3, .kv4 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kv4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 520px) { .kv4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kv3 > div, .kv4 > div { display: flex; flex-direction: column; min-width: 0; }
.kv3 span, .kv4 span { font-size: 11px; color: var(--muted); }
.kv3 b, .kv4 b { font-size: 15px; font-family: var(--f-mono); }
.kv3 em { font-style: normal; font-size: 11px; color: var(--muted); } .kv3 em.up { color: var(--good); } .kv3 em.down { color: var(--warn); }
.spark-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.spark { display: block; max-width: 100%; height: auto; }
.now-block { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--card-2); border-left: 3px solid var(--accent); }
.now-title { font-weight: 600; font-size: 15px; }
.next-block p { font-weight: 500; }
.mini-prog { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); margin-top: auto; }
.proto-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.proto { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.proto:first-child { border-top: 0; padding-top: 0; }
.proto-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.proto-top { display: flex; gap: 8px; align-items: center; }
.proto-time { font-size: 11px; color: var(--muted); }
.proto-title { font-weight: 600; }
.proto-detail { font-size: 12.5px; color: var(--muted); }
.proto.is-done .proto-title { text-decoration: line-through; color: var(--muted); }
.insight { background: linear-gradient(160deg, color-mix(in srgb, var(--accent-2) 14%, var(--card)), var(--card) 65%); }
.insight p { font-size: 13.5px; }
.insight .btn { align-self: flex-start; }
.flag-list, .mach-mini, .wear, .supp, .goals, .programs, .found, .sees, .cans, .issues, .cues { list-style: none; margin: 0; padding: 0; }
.flag-list li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.flag-list li:first-child { border-top: 0; }
.flag-list li > div:first-child { display: flex; flex-direction: column; }
.flag-v { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 13px; }
.mach-mini li { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.mach-mini li span:nth-child(2) { flex: 1; }

/* ── biology ── */
.hstat + .hstat { }
.sysmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sys { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.sys span { font-size: 12px; color: var(--muted); }
.sys b { font: 700 22px var(--f-mono); }
.sys em { font-style: normal; font-size: 11px; color: var(--muted); }
.sys.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sys-bar { display: block; height: 4px; border-radius: 2px; background: var(--card-2); overflow: hidden; }
.sys-bar i { display: block; height: 100%; background: var(--accent); }
.legend { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 6px; border-radius: 3px; margin-left: 6px; }
.lg-normal { background: color-mix(in srgb, var(--muted) 30%, transparent); } .lg-opt { background: color-mix(in srgb, var(--good) 55%, transparent); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 8px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl.compact th, .tbl.compact td { padding: 7px 10px; }
.card:not(.flush) .tbl.compact th:first-child, .card:not(.flush) .tbl.compact td:first-child { padding-left: 0; }
.tbl .r { text-align: right; }
.rcell { min-width: 180px; } .rcell .small { display: block; margin-top: 3px; }
.rbar { position: relative; height: 10px; border-radius: 5px; background: var(--card-2); }
.rb-normal { position: absolute; top: 2px; bottom: 2px; background: color-mix(in srgb, var(--muted) 28%, transparent); border-radius: 3px; }
.rb-opt { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 45%, transparent); border-radius: 5px; }
.rb-tick { position: absolute; top: -3px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; box-shadow: 0 0 0 2px var(--card); }
.rb-good { background: var(--good); } .rb-warn { background: var(--warn); } .rb-bad { background: var(--bad); }
.valbtn { background: none; border: 1px dashed transparent; border-radius: 4px; padding: 2px 4px; cursor: pointer; white-space: nowrap; font-family: var(--f-mono); }
.valbtn:hover { border-color: var(--line-2); }
.inline-edit { display: flex; gap: 6px; } .inline-edit input { width: 84px; }
.wear li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.wear li:first-child { border-top: 0; }

/* ── fuel ── */
.macros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
.macro-h { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.macro-h b { color: var(--fg); font-size: 13px; } .macro-h small { color: var(--muted); font-weight: 400; }
.meal-form { display: grid; grid-template-columns: 2fr repeat(4, minmax(56px, 1fr)) auto; gap: 8px; }
@media (max-width: 640px) { .meal-form { grid-template-columns: repeat(2, minmax(0, 1fr)); } .meal-form input:first-of-type { grid-column: 1 / -1; } }
.presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.water { position: relative; height: 120px; border-radius: var(--r); background: var(--card-2); overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line); }
.water-fill { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--accent-2) 35%, transparent); transition: height .4s; }
.water b { position: relative; font: 700 26px var(--f-mono); }
.supp li { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.supp li:first-child { border-top: 0; }
.supp li.is-done b { text-decoration: line-through; color: var(--muted); }

/* ── life ── */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.tl { display: grid; grid-template-columns: 48px 14px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 64px; top: 0; bottom: 0; width: 1px; background: var(--line); }
.tl-t { font-size: 12px; color: var(--muted); padding-top: 2px; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--card); }
.tl-b { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; min-width: 0; }
.tl.past { opacity: .5; }
.tl.live .tl-b p { font-weight: 700; color: var(--accent); }
.tl.live .tl-t { color: var(--accent); }
.block-form { display: grid; grid-template-columns: 110px 70px 1fr 110px auto; gap: 8px; }
@media (max-width: 640px) { .block-form { grid-template-columns: 1fr 1fr; } .block-form input[name=n] { grid-column: 1 / -1; } }
.scale { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.breath { display: grid; place-items: center; height: 150px; position: relative; }
.breath-orb { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 45%, transparent), color-mix(in srgb, var(--accent) 8%, transparent)); transform: scale(.55); transition: transform 1s linear; }
#breath-label { position: absolute; font-weight: 600; font-size: 13px; }
.breath-card .btn { align-self: center; }
.habits { display: flex; flex-direction: column; gap: 6px; overflow-x: auto; }
.hab-days, .hab-row { display: grid; grid-template-columns: minmax(130px, 1fr) repeat(7, 26px) 46px; gap: 6px; align-items: center; }
.hab-days span { text-align: center; } .hab-days span:first-child { text-align: left; }
.hab-n { font-size: 13px; }
.hab-row b { text-align: center; font-size: 13px; }
.hab-cell { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--card-2); cursor: pointer; }
.hab-cell.on { background: var(--accent); border-color: var(--accent); }
.goals li { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.goals li:first-child { border-top: 0; padding-top: 0; }
.goal-h { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.goal-h span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.goal-ctl { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.goal-ctl span { margin-right: auto; }
.confirm { border: 1px solid var(--bad); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* ── training ── */
.ex { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.ex-done { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.ex-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ex-n { font-weight: 700; font-size: 15px; }
.ex-h .muted { display: flex; align-items: center; gap: 6px; }
.ex-r { display: flex; gap: 8px; align-items: center; }
.sets { display: flex; flex-direction: column; gap: 4px; }
.set { display: grid; grid-template-columns: 34px repeat(3, minmax(0, 92px)) 30px; gap: 8px; align-items: center; }
.set input { padding: 5px 8px; font-family: var(--f-mono); width: 100%; }
.set-h { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.set.on input { border-color: color-mix(in srgb, var(--accent) 40%, var(--line-2)); }
.ex-f { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.ai-note { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--accent); }
.weeks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.weeks span { text-align: center; font: 11px var(--f-mono); padding: 5px 0; border-radius: 4px; background: var(--card-2); color: var(--muted); }
.weeks span.on { background: color-mix(in srgb, var(--accent) 30%, var(--card-2)); color: var(--fg); }
.weeks span.cur { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.chart-wrap { overflow-x: auto; } .chart { width: 100%; height: auto; display: block; }
.axis { font: 8px var(--f-mono); fill: var(--muted); }
.programs li { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.programs li:first-child { border-top: 0; }
.programs li.cur b { color: var(--accent); }

/* ── machines ── */
.fleet { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.mcard { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.mcard.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mcard-top { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.mcard .mono { color: var(--muted); font-size: 10.5px; }
.tele-wrap { width: 100%; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; margin: 0; font-size: 13px; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pair { border-color: var(--accent); }
.scanbar { height: 4px; border-radius: 2px; background: var(--card-2); overflow: hidden; }
.scanbar i { display: block; width: 30%; height: 100%; background: var(--accent); animation: scan 1.1s ease-in-out infinite alternate; }
@keyframes scan { from { transform: translateX(-10%); } to { transform: translateX(240%); } }
.found li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }

/* ── AR ── */
.ar-ctl { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.faults { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ar-stage { position: relative; background: var(--stage); border-color: var(--line-2); }
.ar-stage canvas { display: block; width: 100%; }
.ar-badge { position: absolute; top: 12px; right: 14px; }
.live.off { color: var(--warn); } .live.off i { background: var(--warn); animation: none; }
.ar-msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(420px, 86%); padding: 14px 18px; border-radius: var(--r); background: rgba(4,10,9,0.86); color: #ecf6f2; border: 1px solid rgba(0,200,180,0.35); text-align: center; font-size: 13.5px; }
.ar-tip { padding: 10px 14px; color: var(--muted); border-top: 1px solid var(--line); background: var(--card); }
.ar-kv b { font-size: 18px; text-transform: capitalize; }
.cues li { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.cues li:first-child { border-top: 0; }
.cue-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
.cue-good .cue-dot { background: var(--good); } .cue-warn .cue-dot { background: var(--warn); } .cue-bad .cue-dot { background: var(--bad); }

/* ── gym ── */
.plan-card { background: var(--card); }
.plan-tools { padding: 10px 14px; border-bottom: 1px solid var(--line); min-height: 48px; display: flex; align-items: center; }
.plan-wrap { padding: 12px; overflow: auto; }
#plan { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#plan .room { fill: var(--card-2); stroke: var(--fg); stroke-width: .18; }
#plan .g1 { stroke: var(--line); stroke-width: .04; } #plan .g5 { stroke: var(--line-2); stroke-width: .08; }
#plan .gl { font: .9px var(--f-mono); fill: var(--muted); }
#plan .door { fill: var(--accent); }
#plan .gi { cursor: grab; outline: none; }
#plan .gi:active { cursor: grabbing; }
#plan .fp { stroke-width: .12; fill-opacity: .22; }
#plan .clr { fill: none; stroke-width: .07; stroke-dasharray: .35 .25; opacity: .7; }
#plan .gt { font-family: var(--f-body); font-weight: 600; fill: var(--fg); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#plan .z-strength .fp { fill: var(--z-strength); stroke: var(--z-strength); } #plan .z-strength .clr { stroke: var(--z-strength); }
#plan .z-cardio .fp { fill: var(--z-cardio); stroke: var(--z-cardio); } #plan .z-cardio .clr { stroke: var(--z-cardio); }
#plan .z-functional .fp { fill: var(--z-functional); stroke: var(--z-functional); }
#plan .z-recovery .fp { fill: var(--z-recovery); stroke: var(--z-recovery); } #plan .z-recovery .clr { stroke: var(--z-recovery); }
#plan .z-tech .fp { fill: var(--z-tech); stroke: var(--z-tech); }
#plan .st-soft .fp { stroke: var(--warn); stroke-width: .2; } #plan .st-soft .clr { stroke: var(--warn); opacity: 1; }
#plan .st-hard .fp { stroke: var(--bad); stroke-width: .25; fill: var(--bad); }
#plan .gi.sel .fp, #plan .gi:focus-visible .fp { stroke: var(--fg); stroke-width: .3; fill-opacity: .4; }
.palette { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pal { display: flex; gap: 8px; align-items: center; text-align: left; padding: 7px 9px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card-2); cursor: pointer; font-size: 12.5px; min-width: 0; }
.pal:hover { border-color: var(--accent); }
.pal > span:last-child { min-width: 0; }
.pal-sw { width: 10px; height: 26px; border-radius: 3px; flex: 0 0 10px; }
.z-strength .pal-sw, .zonebar .z-strength, .zone-legend i.z-strength { background: var(--z-strength); }
.z-cardio .pal-sw, .zonebar .z-cardio, .zone-legend i.z-cardio { background: var(--z-cardio); }
.z-functional .pal-sw, .zonebar .z-functional, .zone-legend i.z-functional { background: var(--z-functional); }
.z-recovery .pal-sw, .zonebar .z-recovery, .zone-legend i.z-recovery { background: var(--z-recovery); }
.z-tech .pal-sw, .zonebar .z-tech, .zone-legend i.z-tech { background: var(--z-tech); }
.issues li { font-size: 12.5px; padding: 5px 0 5px 14px; position: relative; }
.issues li::before { content: ""; position: absolute; left: 0; top: 11px; width: 6px; height: 6px; border-radius: 50%; }
.iss-hard::before { background: var(--bad); } .iss-soft::before { background: var(--warn); } .iss-ok::before { background: var(--good); }
.zonebar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.zone-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.zone-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

/* ── coach ── */
.chat { height: min(680px, calc(100vh - 210px)); min-height: 420px; }
.chat-scroll { flex: 1; overflow-y: auto; padding: 16px; }
.chat-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; }
.msg-me { justify-content: flex-end; }
.msg-b { max-width: min(560px, 88%); padding: 10px 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.msg-ai .msg-b { background: var(--card-2); border: 1px solid var(--line); border-top-left-radius: 3px; }
.msg-me .msg-b { background: var(--accent); color: var(--accent-fg); border-top-right-radius: 3px; }
.msg-err .msg-b { border-color: var(--bad); }
.msg-b ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.msg-b em { color: var(--muted); font-size: 12px; }
.thinking { color: var(--muted); animation: pulse 1.4s infinite; }
.quick { display: flex; gap: 6px; padding: 10px 16px 0; overflow-x: auto; flex-wrap: nowrap; }
.quick .chip-btn { flex: 0 0 auto; }
.chat-form { display: flex; gap: 8px; padding: 12px 16px 16px; }
.chat-form textarea { resize: none; min-height: 40px; max-height: 120px; }
.sees li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.sees li:first-child { border-top: 0; }
.cans li { font-size: 13px; padding: 4px 0 4px 16px; position: relative; color: var(--muted); }
.cans li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }

/* ── system ── */
.loop { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .loop { grid-template-columns: 1fr 1fr; } }
.loop li { display: flex; flex-direction: column; gap: 3px; padding: 12px; border-radius: var(--r-sm); background: var(--card-2); border: 1px solid var(--line); position: relative; }
.loop-n { font-size: 11px; color: var(--accent); }
.arch { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 16px; }
@media (max-width: 1000px) { .arch { grid-template-columns: 1fr; } }
.layers { display: flex; flex-direction: column; gap: 8px; }
.layer { display: grid; grid-template-columns: 190px 1fr; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
@media (max-width: 700px) { .layer { grid-template-columns: 1fr; } }
.layer header { display: flex; gap: 10px; align-items: flex-start; }
.layer header .mono { font-size: 11px; color: var(--accent); padding: 2px 6px; border: 1px solid var(--accent); border-radius: 4px; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.mod { display: flex; flex-direction: column; gap: 4px; padding: 9px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card-2); text-align: left; font-size: 13px; min-width: 0; }
button.mod { cursor: pointer; } button.mod:hover { border-color: var(--accent); }
.mod-top { display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
.mod.st-planned { border-style: dashed; }
.cross { display: flex; flex-direction: column; gap: 8px; }
.cross section { padding: 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--accent) 4%, transparent) 8px 16px), var(--card); display: flex; flex-direction: column; gap: 4px; }
.topo { margin: 0; font-size: 11px; line-height: 1.35; color: var(--muted); overflow-x: auto; }


/* ── holographic anatomy panels ── */
.holo { --fg: #eaf1ff; --muted: rgba(226, 236, 255, .68); --line: rgba(255, 255, 255, .13); --card-2: rgba(255, 255, 255, .08); --accent: #5b9bff; --accent-2: #38bdf8; --btn: #ffffff; --btn-fg: #0a1633;
  color: var(--fg); border-color: transparent; position: relative; overflow: hidden;
  background: radial-gradient(110% 80% at 28% 18%, #123a9e 0%, var(--holo-bg) 52%, #020717 100%); }
.holo::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px); }
.holo .eyebrow { color: #8fd3ff; }
.hero-card { display: grid; grid-template-columns: minmax(150px, .85fr) minmax(0, 1.15fr); gap: 8px; align-items: center; padding: 18px 22px; }
.holo-body { min-width: 0; }
.holo-score { display: flex; flex-direction: column; gap: 14px; min-width: 0; position: relative; z-index: 1; }
.holo-score .score-ring { align-self: flex-start; }
.holo-note { font-size: 12px; color: var(--muted); }
.holo .sbar { color: var(--muted); } .holo .sbar b { color: var(--fg); } .holo .sbar:hover { color: var(--fg); }
@media (max-width: 520px) { .hero-card { grid-template-columns: 1fr; } .holo-body { width: 100%; } .hero-card .anatomy { max-height: 280px; } .body-card .anatomy { max-height: 380px; } }

/* ─── Body scan modes: camera · hologram · anatomy ─── */
.cc-modes { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .4); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.cc-modes button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: #fff; font: 600 12.5px var(--f-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }

.cc-modes button:not([aria-pressed="true"]):hover { background: rgba(255, 255, 255, .14); }
.cc-fig { gap: 12px; }

.cam { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }

.thumb { flex: 0 0 auto; display: flex; flex-direction: column; gap: 3px; align-items: center; padding: 3px; border: 1.5px solid transparent; border-radius: 10px; background: none; cursor: pointer; font-size: 10.5px; color: var(--muted); }

/* hologram + anatomy stage */
.scan-wrap { position: relative; height: 600px; aspect-ratio: var(--ar, 2 / 3); max-width: 100%; z-index: 1; }

.scan-busy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 999px; background: rgba(6, 18, 51, .72); color: #bfe9ff; font: 500 12px var(--f-mono); letter-spacing: .06em; white-space: nowrap; animation: pulse 1.6s infinite; }

.scan-cta .gc-add:hover { background: rgba(255, 255, 255, .14); }

/* overlay: hologram */

/* ── Look v5: AI lab skin, shared by every colour scheme ── */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient i { position: absolute; width: 72vmax; height: 72vmax; border-radius: 50%; opacity: var(--glow-a); background: radial-gradient(closest-side, var(--glow-1), transparent 72%); }
.ambient i:nth-child(1) { left: -26vmax; top: -36vmax; }
.ambient i:nth-child(2) { right: -30vmax; top: -16vmax; width: 62vmax; height: 62vmax; background: radial-gradient(closest-side, var(--glow-2), transparent 72%); }
.ambient i:nth-child(3) { left: 16vmax; bottom: -50vmax; width: 82vmax; height: 82vmax; opacity: calc(var(--glow-a) * .7); background: radial-gradient(closest-side, var(--glow-3), transparent 72%); }
.ambient b { position: absolute; inset: 0; opacity: .55; background-image: radial-gradient(color-mix(in srgb, var(--fg) 15%, transparent) 1px, transparent 1.6px); background-size: 24px 24px; -webkit-mask-image: radial-gradient(ellipse 72% 56% at 50% 0%, #000, transparent 80%); mask-image: radial-gradient(ellipse 72% 56% at 50% 0%, #000, transparent 80%); }
:root[data-fx="full"] .ambient i { animation: amb-drift 42s ease-in-out infinite alternate; }
:root[data-fx="full"] .ambient i:nth-child(2) { animation-duration: 54s; animation-direction: alternate-reverse; }
:root[data-fx="full"] .ambient i:nth-child(3) { animation-duration: 66s; }
@keyframes amb-drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(7vmax, 5vmax, 0) scale(1.14); } }
.app { position: relative; z-index: 1; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--fg) 20%, transparent) transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 16%, transparent); }

/* glass shell */
.hdr { position: relative; z-index: 20; background: color-mix(in srgb, var(--rail) 58%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5); border-bottom-color: color-mix(in srgb, var(--line) 70%, transparent); }
.hdr::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; pointer-events: none; background: linear-gradient(90deg, transparent 4%, color-mix(in srgb, var(--accent) 65%, transparent) 32%, color-mix(in srgb, var(--accent-2) 65%, transparent) 68%, transparent 96%); }
.logo-mk { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); box-shadow: 0 6px 18px -6px var(--brand-1), inset 0 1px 0 rgba(255, 255, 255, .3); text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.logo b { font-family: var(--f-display); font-weight: 600; }
.chip-score { background: color-mix(in srgb, var(--card) 70%, transparent); box-shadow: inset 0 1px 0 var(--sheen); }
.avatar { position: relative; background: linear-gradient(135deg, var(--btn), var(--btn-2)); color: var(--btn-fg); box-shadow: 0 6px 16px -8px var(--btn); }
.avatar[data-auth="in"]::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px var(--bg); }
nav#nav { background: color-mix(in srgb, var(--rail) 52%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border-right-color: color-mix(in srgb, var(--line) 70%, transparent); border-top-color: color-mix(in srgb, var(--line) 70%, transparent); }
.nav-i { transition: color .15s, background-color .15s, box-shadow .15s; }
.nav-i:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.nav-i[aria-current="page"] { color: var(--accent); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 20%, transparent), color-mix(in srgb, var(--accent-2) 10%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 32%, transparent), 0 10px 24px -14px var(--accent); }
.nav-i[aria-current="page"] svg { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 55%, transparent)); }
@media (max-width: 560px) { .hdr { gap: 10px; } }
@media (max-width: 760px) { .logo .logo-mk { display: grid; } }

/* surfaces and type */
.card, .hstat { box-shadow: inset 0 1px 0 var(--sheen), var(--shadow); }
.mod, .sys, .mcard, .pal { transition: border-color .15s, box-shadow .15s; }
button.mod:hover, .sys:hover, .mcard:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 12px 30px -18px var(--accent); }
.eyebrow { display: flex; align-items: center; gap: 8px; font: 500 11px var(--f-mono); letter-spacing: .14em; }
span.eyebrow { display: inline-flex; }
.eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
:root[data-fx="full"] .eyebrow::before { animation: eb-pulse 2.8s ease-in-out infinite; }
@keyframes eb-pulse { 50% { opacity: .4; } }
.vhead h1 { background: linear-gradient(100deg, var(--fg) 35%, color-mix(in srgb, var(--accent) 78%, var(--fg))); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; padding-bottom: .06em; }

/* actions */
.btn { background: linear-gradient(135deg, var(--btn), var(--btn-2)); border-color: transparent; color: var(--btn-fg); box-shadow: 0 8px 22px -12px var(--btn), inset 0 1px 0 rgba(255, 255, 255, .22); transition: filter .15s, box-shadow .15s, transform .1s; }
.btn:hover { filter: brightness(1.06) saturate(1.08); box-shadow: 0 12px 28px -12px var(--btn), inset 0 1px 0 rgba(255, 255, 255, .28); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: color-mix(in srgb, var(--card) 55%, transparent); border-color: var(--line-2); color: var(--fg); box-shadow: none; }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; box-shadow: 0 8px 22px -12px var(--bad); }
.btn.ghost.danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); box-shadow: none; }
.btn[disabled] { opacity: .55; cursor: progress; filter: none; }
.seg { background: color-mix(in srgb, var(--card) 60%, transparent); }
.seg button.on { background: linear-gradient(135deg, var(--btn), var(--btn-2)); color: var(--btn-fg); }
input, select, textarea { background: color-mix(in srgb, var(--card-2) 78%, transparent); transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
#toast { background: color-mix(in srgb, var(--fg) 92%, transparent); color: var(--bg); border-radius: 12px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 14px 34px -14px color-mix(in srgb, var(--accent) 70%, transparent); }

/* appearance picker */
.look-btn { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--card) 70%, transparent); color: var(--fg); cursor: pointer; padding: 0; }
.look-btn:hover, .look-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.look-pop { position: absolute; top: calc(100% + 8px); right: max(16px, env(safe-area-inset-right, 0px)); width: 360px; max-width: calc(100% - 32px); z-index: 60; padding: 14px; display: flex; flex-direction: column; gap: 12px; border-radius: var(--r); border: 1px solid var(--line-2); background: color-mix(in srgb, var(--rail) 96%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .5), inset 0 1px 0 var(--sheen); }
.look-pop[hidden] { display: none; }
.lk-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lk-h b { font: 600 15px var(--f-display); }
.lk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

/* ── Electric: deep-blue lab field with the cell · skeleton · human · cyborg figure (js/body.js) ── */
:root { --backdrop: none; --on-bg: var(--fg); --on-bg-muted: var(--muted); --on-bg-2: color-mix(in srgb, var(--accent) 78%, var(--fg)); --glass-p: 58%; }

.vhead h1 { background: linear-gradient(100deg, var(--on-bg) 35%, var(--on-bg-2)); -webkit-background-clip: text; background-clip: text; }

/* Ascend: the figure as a preview of integration */
.card.au-body { padding: 0; gap: 0; overflow: hidden; margin-bottom: 16px; color: #eaf0ff; background: radial-gradient(120% 100% at 50% 18%, #1b44e6 0%, #0b2391 45%, #030b36 100%); border-color: rgba(143, 180, 255, .3); }

.au-body-ticks b { color: #fff; }

/* ── Surgical-hologram stages: the Electric page keeps its bright blue field (FitScript-style) while every hologram
   stage reads as a dark surgical theatre (Medivis-style AR): near-black glass, HUD corner brackets, ruler ticks, callouts ── */
:root[data-scheme="electric"] .cc-stage {
  --holo-1: #1f5bff; --holo-2: #7cc8ff; --holo-3: #e6f3ff;
  --gc-bg: rgba(8, 18, 48, .74); --gc-fg: #eaf1ff; --gc-muted: #9fb2d8; --gc-ring: rgba(124, 200, 255, .16); --gc-acc: #7cc8ff; --gc-soft: rgba(124, 200, 255, .16);
  background: radial-gradient(ellipse 60% 70% at 50% 42%, #12307e 0%, #081a52 45%, #020822 100%);
  box-shadow: inset 0 0 0 1px rgba(143, 200, 255, .22), 0 30px 70px -30px rgba(0, 4, 20, .8);
}
.holo { background: radial-gradient(110% 80% at 28% 18%, #0f2c78 0%, #050d2a 52%, #01030b 100%); }
.myo-av { position: relative; background: radial-gradient(ellipse at 50% 35%, #0b2260 0%, #040b20 58%, #01030a 100%); }
.card.au-body { background: radial-gradient(120% 100% at 50% 18%, #12309a 0%, #061450 45%, #01040f 100%); }
.img-pl { background: #02050f; }
.cc-stage::before, .hub-stage::before, .holo::before, .myo-av::before, .au-body-stage::before, .xr-stage::before, .ar-stage::before, .img-holo::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5; --hc: rgba(175, 222, 255, .62); --ht: rgba(175, 222, 255, .32);
  background:
    linear-gradient(var(--hc), var(--hc)) left 10px top 10px / 18px 1px no-repeat, linear-gradient(var(--hc), var(--hc)) left 10px top 10px / 1px 18px no-repeat,
    linear-gradient(var(--hc), var(--hc)) right 10px top 10px / 18px 1px no-repeat, linear-gradient(var(--hc), var(--hc)) right 10px top 10px / 1px 18px no-repeat,
    linear-gradient(var(--hc), var(--hc)) left 10px bottom 10px / 18px 1px no-repeat, linear-gradient(var(--hc), var(--hc)) left 10px bottom 10px / 1px 18px no-repeat,
    linear-gradient(var(--hc), var(--hc)) right 10px bottom 10px / 18px 1px no-repeat, linear-gradient(var(--hc), var(--hc)) right 10px bottom 10px / 1px 18px no-repeat,
    repeating-linear-gradient(to bottom, var(--ht) 0 1px, transparent 1px 14px) left 10px center / 5px 34% no-repeat,
    repeating-linear-gradient(to bottom, var(--ht) 0 1px, transparent 1px 14px) right 10px center / 5px 34% no-repeat;
}
.img-holo::before { z-index: 1;
  background:
    linear-gradient(var(--hc), var(--hc)) left 10px top 10px / 18px 1px no-repeat, linear-gradient(var(--hc), var(--hc)) left 10px top 10px / 1px 18px no-repeat,
    linear-gradient(var(--hc), var(--hc)) right 10px top 10px / 18px 1px no-repeat, linear-gradient(var(--hc), var(--hc)) right 10px top 10px / 1px 18px no-repeat,
    linear-gradient(var(--hc), var(--hc)) left 10px bottom 10px / 18px 1px no-repeat, linear-gradient(var(--hc), var(--hc)) left 10px bottom 10px / 1px 18px no-repeat,
    linear-gradient(var(--hc), var(--hc)) right 10px bottom 10px / 18px 1px no-repeat, linear-gradient(var(--hc), var(--hc)) right 10px bottom 10px / 1px 18px no-repeat,
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px);
}
/* anatomical callouts on the figure (label changes with the band: human, x-ray, cyborg) */
.au-anno { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.au-anno svg { position: absolute; inset: 0; overflow: visible; }
.au-anno polyline { fill: none; stroke: rgba(175, 222, 255, .55); stroke-width: 1; }
.au-anno .an-ring { fill: none; stroke-width: 1.2; opacity: .85; }
.an-l { position: absolute; transform: translateY(-50%); max-width: 158px; padding: 4px 8px; border-radius: 6px; background: rgba(2, 8, 30, .66); border: 1px solid rgba(175, 222, 255, .28); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.an-L { text-align: right; }

.an-l i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin: 0 5px 1px; vertical-align: middle; }
/* ══ Shell v6 (FitScript-style): top bar with a centred pill navigation and menus, full-width workspace,
   tab bar and menu sheet on phones. Replaces the icon rail. ══ */
.app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
.hdr { gap: 12px; height: 64px; }
.hdr-sp { flex: 1 1 0; min-width: 8px; }
.topnav { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(16, 24, 40, .05); position: static; }
.tn-i { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; border: 0; background: none; color: var(--muted); font: 500 14px var(--f-body); text-decoration: none; cursor: pointer; white-space: nowrap; }
.tn-i:hover { color: var(--fg); background: var(--card-2); }
.tn-i[aria-current="page"], .tn-i.on { color: var(--fg); background: var(--card-2); font-weight: 600; }
.tn-i svg.chev { width: 12px; height: 12px; opacity: .6; transition: transform .15s; }
.tn-i[aria-expanded="true"] svg.chev { transform: rotate(180deg); }
.tn-menu { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 70; width: min(620px, calc(100vw - 32px)); padding: 10px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 24px 60px -24px rgba(10, 28, 61, .35); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.tn-menu[hidden] { display: none; }
.tn-menu a { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 2px 12px; align-items: center; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--fg); }
.tn-menu a:hover, .tn-menu a[aria-current="page"] { background: var(--card-2); }
.tn-menu a > span:first-child { grid-row: span 2; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--card-2); color: var(--accent); border: 1px solid var(--line); }
.tn-menu b { font: 600 14px var(--f-body); }
.tn-menu small { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.tabbar { display: none; }
.sheet { position: fixed; inset: 0; z-index: 80; background: rgba(4, 10, 24, .45); display: flex; align-items: flex-end; }
.sheet[hidden] { display: none; }
.sheet-in { width: 100%; max-height: 82vh; overflow: auto; background: var(--card); border-radius: 22px 22px 0 0; padding-block: 10px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); align-self: center; }
.sheet h3 { margin: 0 0 6px; font: 600 12px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.sheet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.sheet-grid a { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--card-2); color: var(--fg); text-decoration: none; font-weight: 500; font-size: 14px; min-width: 0; }
.sheet-grid a[aria-current="page"] { outline: 2px solid var(--accent); }
.sheet-grid a span { color: var(--accent); display: grid; }
#view { max-width: 1320px; }
@media (max-width: 1120px) { .tn-i { padding: 8px 12px; } .logo span { display: none; } .logo .logo-mk { display: grid; } }
@media (max-width: 900px) {
  .topnav { display: none; }
  .app { grid-template-rows: auto 1fr auto; }
  .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-row: 3; background: var(--card); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font: 500 11px var(--f-body); text-decoration: none; border-radius: 10px; cursor: pointer; }
  .tabbar [aria-current="page"] { color: var(--accent); background: var(--card-2); }
  .save { display: none; }
}

/* ══ Clinical (default): flat white cards, navy type, quiet chrome ══ */
:root[data-scheme="clinical"] { --f-display: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --r: 16px; --r-sm: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06); --sheen: transparent; }

:root[data-scheme="clinical"][data-theme="dark"] { --shadow: 0 0 0 1px transparent; }

:root[data-scheme="clinical"] .eyebrow { font: 600 12.5px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--accent); }

:root[data-scheme="clinical"] .banner { background: var(--card); border-color: var(--line); }

/* ══ 3D anatomy (js/anatomy3d.js) ══ */
.a3d-stage, .a3d { position: relative; overflow: hidden; isolation: isolate; border-radius: var(--r); min-height: 420px; color: #e8f0ff; background: radial-gradient(120% 90% at 50% 28%, #133585 0%, #08173f 46%, #020818 100%); }
.a3d-stage[data-look="real"], .a3d[data-look="real"] { background: radial-gradient(120% 90% at 50% 28%, #22314f 0%, #0f182b 52%, #060a14 100%); }
.a3d-full { height: min(78vh, 840px); min-height: 540px; }
.a3d-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.a3d-cv:active { cursor: grabbing; }
.a3d-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.a3d-lines polyline { fill: none; stroke: rgba(170, 210, 255, .75); stroke-width: 1; }
.a3d-lines circle { fill: #ffffff; stroke: rgba(170, 210, 255, .9); stroke-width: 2; }
.a3d-spots { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.a3d-spot { position: absolute; left: 0; top: 0; margin: -8px 0 0 -8px; display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: #eef5ff; font: 600 11.5px var(--f-body); cursor: pointer; pointer-events: auto; }
.a3d-spot[hidden] { display: none; }
.a3d-spot i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ffffff; background: var(--spot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--spot) 35%, transparent); }
.a3d-spot span { padding: 3px 8px; border-radius: 6px; background: rgba(2, 8, 28, .74); border: 1px solid rgba(170, 210, 255, .3); white-space: nowrap; opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; }
.a3d-spot:hover span, .a3d-spot:focus-visible span { opacity: 1; transform: none; }
.a3d-spot.st-good { --spot: #22c55e; } .a3d-spot.st-warn { --spot: #f59e0b; } .a3d-spot.st-bad { --spot: #ef4444; } .a3d-spot.st-muted { --spot: #94a3b8; }
:root[data-fx="full"] .a3d-spot i { animation: a3d-pulse 2.6s ease-out infinite; }
@keyframes a3d-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--spot) 60%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
.a3d-load { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 4; display: flex; align-items: center; gap: 10px; max-width: 80%; text-align: center; font: 500 13px var(--f-body); color: #d4e4ff; }
.a3d-load[hidden] { display: none; }
.a3d-spin { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(170, 210, 255, .25); border-top-color: #a8d4ff; animation: a3d-spin .9s linear infinite; }
@keyframes a3d-spin { to { transform: rotate(360deg); } }
.a3d-fail .a3d-spin { display: none; }
.a3d-bar { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.a3d-bar > * { pointer-events: auto; }
.a3d-presets, .a3d-look { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(2, 8, 28, .66); border: 1px solid rgba(170, 210, 255, .22); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.a3d-presets button, .a3d-look button { border: 0; background: transparent; color: #d4e4ff; font: 500 12.5px var(--f-body); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.a3d-presets button:hover, .a3d-look button:hover { color: #ffffff; }
.a3d-presets button[aria-pressed="true"], .a3d-look button[aria-pressed="true"] { background: #ffffff; color: #0a1c3d; }

/* ══ Recovery (js/recovery.js) ══ */
.rc-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rc-steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
